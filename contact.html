<h1>Contact Us</h1>
   <p class="contact-top"> Call: 015 234 5678 | Email: gardenbloom@gmail.com</p>
    <div class="Contact-container">
        <form>
        <h2>Let Us Hear From You</h2>
        
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"placeholder="Your full name"><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"placeholder="Your email required"><br>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone"placeholder="Your phone number"><br>

            <label for="subject">Subject</label>
            <select name="Subject" id="subject">
                <option>General Inquiry</option>
                <option>Support</option>
                <option>Feedback</option>
                <option>Other</option><br><br>

            </select><br>
            
            <label for="Message"></label>

            <textarea name="message" id="message" placeholder="Type your message here"></textarea><br>
            
            <button type="submit">Send Message</button>


        </form>
    </div>
</body>
